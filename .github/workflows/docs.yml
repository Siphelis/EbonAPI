name: Publish documentation

on:
  push:
    branches:
      - main
    paths:
      - 'Documentation/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer MkDocs Material
        run: pip install mkdocs-material

      - name: Construire le site
        run: mkdocs build --strict

      - name: Téléverser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ne garder que le dernier déploiement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # L'API rend les déploiements du plus récent au plus ancien : on garde le premier,
          # on désactive puis on supprime tous les autres.
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=100" \
            --jq '.[1:][].id' \
          | while read -r id; do
              gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" -f state=inactive > /dev/null
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/deployments/${id}"
              echo "Déploiement ${id} supprimé"
            done
